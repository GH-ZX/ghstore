name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    # A throwaway Postgres for migrations and tests. Never point CI at production.
    services:
      postgres:
        image: postgres:17  # the same major version as the Supabase project
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      # pnpm must exist before setup-node, which asks it for the store path.
      - name: Enable pnpm
        run: corepack enable

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc

      # Use the committed lockfile when there is one (commit pnpm-lock.yaml after the first install).
      - name: Install dependencies
        run: |
          if [ -f pnpm-lock.yaml ]; then pnpm install --frozen-lockfile; else pnpm install --no-frozen-lockfile; fi

      - name: Typecheck
        run: pnpm typecheck

      # Floating promises, import cycles, unused imports (ESLint); unused exports and files (knip).
      - name: Lint
        run: pnpm lint

      - name: Build the web app
        run: pnpm build

      # The roles Supabase has, so the migration's access rules are exercised as in production.
      - name: Create Supabase roles
        run: |
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 \
            -c "create role anon nologin" \
            -c "create role authenticated nologin" \
            -c "create role service_role nologin bypassrls"

      - name: Apply migrations
        run: pnpm db:migrate

      - name: Database tests
        run: pnpm db:test

      - name: Unit and API tests
        run: pnpm test
